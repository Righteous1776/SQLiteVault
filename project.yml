name: SQLiteVault
options:
  bundleIdPrefix: com.zeostudio
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 11
    MARKETING_VERSION: 0.3.6
targets:
  SQLiteVault:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SQLiteVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeostudio.SQLiteVault
        INFOPLIST_FILE: SQLiteVault/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SQLiteVault/Resources/SQLiteVault.entitlements
        PRODUCT_NAME: SQLiteVault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    dependencies:
      - sdk: libsqlite3.tbd
  SQLiteVaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SQLiteVaultTests
    dependencies:
      - target: SQLiteVault
schemes:
  SQLiteVault:
    build:
      targets:
        SQLiteVault: all
        SQLiteVaultTests: [test]
    test:
      targets:
        - SQLiteVaultTests
